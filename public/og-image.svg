<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Wykop czy Wyborcza?">
  <rect width="1200" height="630" fill="#18181b"/>
  <rect x="0" y="0" width="1200" height="8" fill="#f4d35e"/>
  <text x="80" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#fafafa">Wykop czy</text>
  <text x="80" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#f4d35e">Wyborcza?</text>
  <text x="80" y="424" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="32" fill="#a1a1aa">Jeden prawdziwy nag&#322;&#243;wek, cztery redakcje.</text>
  <text x="80" y="472" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="32" fill="#a1a1aa">Zgadniesz, kto to opublikowa&#322;?</text>
  <text x="80" y="556" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#71717a">Nowa zagadka codziennie</text>
</svg>
